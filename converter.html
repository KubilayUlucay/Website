<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Converter - Kubilay Ulucay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .drag-area { border-style: dashed; }
        .drag-over { border-color: #3b82f6; background-color: #374151; }
        .progress-bar-container {
            height: 1.25rem;
            background-color: #374151; /* bg-gray-700 */
        }
        .progress-bar {
            height: 100%;
            background-color: #3b82f6; /* bg-blue-600 */
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white antialiased">
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        
        <!-- YENİ: Ana Sayfaya Dön Butonu -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center text-gray-400 hover:text-white transition-colors duration-300 group">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Ana Sayfaya Dön
            </a>
        </div>
        
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                Universal File Converter
            </h1>
            <p class="text-gray-400 mt-2 text-lg">Hemen her şeyi, hemen her şeye dönüştürün.</p>
        </header>

        <div id="drag-area" class="drag-area bg-gray-800 border-2 border-gray-600 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 hover:border-blue-500 hover:bg-gray-700">
            <input type="file" id="file-input" class="hidden">
            <div class="flex flex-col items-center">
                 <svg class="w-16 h-16 text-gray-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                </svg>
                <p class="text-xl font-semibold">Dosyayı buraya sürükleyin veya seçmek için tıklayın</p>
                <p id="file-name" class="text-gray-400 mt-1"></p>
            </div>
        </div>

        <div id="controls" class="mt-6 bg-gray-800 p-6 rounded-2xl hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="output-format" class="block text-sm font-medium text-gray-300 mb-2">Hedef Format:</label>
                    <select id="output-format" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:ring-blue-500 focus:border-blue-500">
                        <optgroup label="Video">
                            <option value="mp4">MP4</option>
                            <option value="mkv">MKV</option>
                            <option value="webm">WebM</option>
                            <option value="mov">MOV</option>
                            <option value="avi">AVI</option>
                            <option value="gif">GIF (Animasyonlu)</option>
                        </optgroup>
                        <optgroup label="Ses">
                            <option value="mp3">MP3</option>
                            <option value="wav">WAV</option>
                            <option value="ogg">OGG</option>
                            <option value="flac">FLAC</option>
                        </optgroup>
                        <optgroup label="Resim">
                            <option value="png">PNG</option>
                            <option value="jpg">JPG</option>
                            <option value="webp">WebP</option>
                            <option value="bmp">BMP</option>
                            <option value="tiff">TIFF</option>
                            <option value="svg">SVG</option>
                        </optgroup>
                         <optgroup label="Doküman">
                            <option value="pdf">PDF</option>
                            <option value="docx">DOCX (Word)</option>
                            <option value="odt">ODT (OpenDocument)</option>
                            <option value="html">HTML</option>
                            <option value="md">Markdown</option>
                            <option value="txt">TXT (Düz Metin)</option>
                            <option value="rtf">RTF</option>
                            <option value="tex">LaTeX</option>
                        </optgroup>
                        <optgroup label="Spreadsheet">
                            <option value="csv">CSV</option>
                            <option value="xlsx">XLSX (Excel)</option>
                        </optgroup>
                        <optgroup label="eBook">
                            <option value="epub">EPUB</option>
                            <option value="mobi">MOBI (Kindle)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="flex items-end">
                     <button id="convert-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300 disabled:bg-gray-500 disabled:cursor-not-allowed">
                        Dönüştür
                    </button>
                </div>
            </div>
        </div>
        
        <div id="status-area" class="mt-6 text-center hidden">
            <p id="status-text" class="mb-3"></p>
            <div class="progress-bar-container w-full rounded-full overflow-hidden">
                <div id="progress-bar" class="progress-bar rounded-full text-center text-white text-sm" style="width: 0%;">0%</div>
            </div>
            <div id="download-area" class="mt-4"></div>
        </div>

    </div>

    <script>
        const dragArea = document.getElementById('drag-area');
        const fileInput = document.getElementById('file-input');
        const controls = document.getElementById('controls');
        const fileNameDisplay = document.getElementById('file-name');
        const convertBtn = document.getElementById('convert-btn');
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const downloadArea = document.getElementById('download-area');
        const outputFormatSelect = document.getElementById('output-format');

        const BASE_URL = 'https://ulucay-file-converter-124999888102.europe-west1.run.app';
        
        let selectedFile = null;
        let pollingInterval = null;

        dragArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        dragArea.addEventListener('dragover', (e) => { e.preventDefault(); dragArea.classList.add('drag-over'); });
        dragArea.addEventListener('dragleave', () => dragArea.classList.remove('drag-over'));
        dragArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dragArea.classList.remove('drag-over');
            handleFile(e.dataTransfer.files[0]);
        });
        convertBtn.addEventListener('click', startConversion);

        function handleFile(file) {
            if (!file) return;
            selectedFile = file;
            fileNameDisplay.textContent = file.name;
            controls.classList.remove('hidden');
            statusArea.classList.add('hidden');
            downloadArea.innerHTML = '';
        }

        async function startConversion() {
            if (!selectedFile) {
                alert('Lütfen bir dosya seçin.');
                return;
            }
            
            resetUI();
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('format', outputFormatSelect.value);

            try {
                const response = await fetch(`${BASE_URL}/convert`, {
                    method: 'POST',
                    body: formData,
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `Sunucu hatası: ${response.status}`);
                }

                const { jobId } = await response.json();
                pollStatus(jobId);

            } catch (error) {
                console.error('Dönüşüm başlatma hatası:', error);
                updateStatusUI('Hata: ' + error.message, 0, true);
            }
        }

        function pollStatus(jobId) {
            pollingInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${BASE_URL}/status/${jobId}`);
                    if (!response.ok) {
                        throw new Error('Durum sunucusuna ulaşılamadı.');
                    }
                    const data = await response.json();
                    updateStatusUI(data.status, data.progress);
                    
                    if (data.progress === 100) {
                        clearInterval(pollingInterval);
                        if (data.status.startsWith('Hata:')) {
                           updateStatusUI(data.status, 100, true);
                        } else {
                            showDownloadButton(jobId);
                        }
                    }
                } catch (error) {
                    console.error('Durum kontrol hatası:', error);
                    clearInterval(pollingInterval);
                    updateStatusUI('Hata: Durum bilgisi alınamadı.', 0, true);
                }
            }, 2000); // 2 saniyede bir kontrol et
        }

        function resetUI() {
            convertBtn.disabled = true;
            statusArea.classList.remove('hidden');
            downloadArea.innerHTML = '';
            updateStatusUI('İşlem başlatılıyor...', 0);
        }
        
        function updateStatusUI(status, progress, isError = false) {
            statusText.textContent = status;
            progressBar.style.width = `${progress}%`;
            progressBar.textContent = `${progress}%`;
            
            if (isError) {
                progressBar.classList.add('bg-red-600');
                progressBar.classList.remove('bg-blue-600');
                convertBtn.disabled = false;
            } else {
                progressBar.classList.remove('bg-red-600');
                progressBar.classList.add('bg-blue-600');
            }
        }

        function showDownloadButton(jobId) {
            const downloadButton = document.createElement('a');
            const originalName = path.parse(selectedFile.name).name;
            const newName = `${originalName}.${outputFormatSelect.value}`;

            downloadButton.href = `${BASE_URL}/download/${jobId}`;
            downloadButton.textContent = `'${newName}' Dosyasını İndir`;
            downloadButton.className = 'inline-block mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-300';
            downloadArea.innerHTML = '';
            downloadArea.appendChild(downloadButton);
            convertBtn.disabled = false;
        }

        // Dosya adı parse etmek için basit bir polyfill
        const path = {
            parse(pathString) {
                const lastDot = pathString.lastIndexOf('.');
                if (lastDot === -1 || lastDot === 0) {
                    return { name: pathString, ext: '' };
                }
                return {
                    name: pathString.substring(0, lastDot),
                    ext: pathString.substring(lastDot)
                };
            }
        };

    </script>
</body>
</html>
